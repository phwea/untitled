<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Tic-Tac-Toe</title>
    <style>
        :root {
            --cell-size: 50px;
            --border-color: #333;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #333;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 5px;
            background-color: var(--border-color);
            border: 5px solid var(--border-color);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        .small-board {
            display: grid;
            grid-template-columns: repeat(3, var(--cell-size));
            grid-template-rows: repeat(3, var(--cell-size));
            grid-gap: 3px;
            background-color: #666;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease-in-out;
        }

        .small-board.active {
            border-color: #4CAF50;
            box-shadow: 0 0 10px #4CAF50;
        }

        .small-board.won-x {
            background-color: rgba(255, 0, 0, 0.2);
        }

        .small-board.won-o {
            background-color: rgba(0, 0, 255, 0.2);
        }

        .small-board.won-tie {
            background-color: rgba(128, 128, 128, 0.2);
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.1s ease-in-out;
            color: #333;
        }

        .cell:not(.taken):hover {
            background-color: #ddd;
        }

        .cell.taken {
            cursor: not-allowed;
        }

        .status-container {
            margin-top: 20px;
            text-align: center;
        }

        #status-message {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        #reset-button {
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            transition: background-color 0.2s;
        }

        #reset-button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <h1>Ultimate Tic-Tac-Toe</h1>
    <div class="game-container">
        <div class="main-grid">
            <!-- The 9 small tic-tac-toe boards will be generated here by JavaScript -->
        </div>
    </div>
    <div class="status-container">
        <p id="status-message"></p>
        <button id="reset-button">Reset Game</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mainGrid = document.querySelector('.main-grid');
            const statusMessage = document.getElementById('status-message');
            const resetButton = document.getElementById('reset-button');

            let currentPlayer = 'X';
            let nextBoard = null;
            let mainBoard = Array(9).fill(null);
            let smallBoards = [];

            const winCombos = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];

            function createBoards() {
                mainGrid.innerHTML = '';
                smallBoards = [];
                for (let i = 0; i < 9; i++) {
                    const smallBoardDiv = document.createElement('div');
                    smallBoardDiv.classList.add('small-board');
                    smallBoardDiv.dataset.boardIndex = i;
                    smallBoards.push(Array(9).fill(null));

                    for (let j = 0; j < 9; j++) {
                        const cell = document.createElement('div');
                        cell.classList.add('cell');
                        cell.dataset.cellIndex = j;
                        cell.addEventListener('click', handleCellClick);
                        smallBoardDiv.appendChild(cell);
                    }
                    mainGrid.appendChild(smallBoardDiv);
                }
            }

            function handleCellClick(event) {
                const clickedCell = event.target;
                const boardIndex = parseInt(clickedCell.parentElement.dataset.boardIndex);
                const cellIndex = parseInt(clickedCell.dataset.cellIndex);

                if (isMoveValid(boardIndex, cellIndex)) {
                    clickedCell.textContent = currentPlayer;
                    clickedCell.classList.add('taken');
                    smallBoards[boardIndex][cellIndex] = currentPlayer;

                    const smallBoardWinner = checkWin(smallBoards[boardIndex]);
                    if (smallBoardWinner) {
                        mainBoard[boardIndex] = smallBoardWinner;
                        updateSmallBoardStatus(boardIndex, smallBoardWinner);
                    } else if (isTie(smallBoards[boardIndex])) {
                        mainBoard[boardIndex] = 'TIE';
                        updateSmallBoardStatus(boardIndex, 'TIE');
                    }

                    if (checkWin(mainBoard)) {
                        endGame(currentPlayer);
                        return;
                    } else if (isTie(mainBoard)) {
                        endGame('TIE');
                        return;
                    }

                    nextBoard = cellIndex;
                    // If the next board is already won or tied, the player can choose any board
                    if (mainBoard[nextBoard] !== null) {
                        nextBoard = null;
                    }
                    togglePlayer();
                    updateStatus();
                }
            }

            function isMoveValid(boardIndex, cellIndex) {
                if (checkWin(mainBoard) || isTie(mainBoard)) {
                    return false;
                }
                if (nextBoard !== null && boardIndex !== nextBoard) {
                    return false;
                }
                if (smallBoards[boardIndex][cellIndex] !== null) {
                    return false;
                }
                return true;
            }

            function checkWin(board) {
                for (const combo of winCombos) {
                    const [a, b, c] = combo;
                    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                        return board[a];
                    }
                }
                return null;
            }

            function isTie(board) {
                return board.every(cell => cell !== null);
            }

            function togglePlayer() {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            }

            function updateStatus() {
                document.querySelectorAll('.small-board').forEach(board => board.classList.remove('active'));
                if (nextBoard !== null) {
                    const nextBoardDiv = document.querySelector(`.small-board[data-board-index="${nextBoard}"]`);
                    if (nextBoardDiv) {
                        nextBoardDiv.classList.add('active');
                    }
                    statusMessage.textContent = `Player ${currentPlayer}'s turn. Play in board ${nextBoard + 1}.`;
                } else {
                    document.querySelectorAll('.small-board').forEach(board => {
                        if (mainBoard[board.dataset.boardIndex] === null) {
                            board.classList.add('active');
                        }
                    });
                    statusMessage.textContent = `Player ${currentPlayer}'s turn. You can play in any board.`;
                }
            }

            function updateSmallBoardStatus(boardIndex, winner) {
                const boardDiv = document.querySelector(`.small-board[data-board-index="${boardIndex}"]`);
                if (boardDiv) {
                    boardDiv.classList.remove('active');
                    if (winner === 'X') {
                        boardDiv.classList.add('won-x');
                    } else if (winner === 'O') {
                        boardDiv.classList.add('won-o');
                    } else if (winner === 'TIE') {
                        boardDiv.classList.add('won-tie');
                    }
                    // Prevent further clicks on a completed small board
                    boardDiv.querySelectorAll('.cell').forEach(cell => cell.classList.add('taken'));
                }
            }

            function endGame(winner) {
                if (winner === 'TIE') {
                    statusMessage.textContent = "Game Over: It's a Tie!";
                } else {
                    statusMessage.textContent = `Game Over: Player ${winner} Wins!`;
                }
                document.querySelectorAll('.cell').forEach(cell => cell.classList.add('taken'));
                document.querySelectorAll('.small-board').forEach(board => board.classList.remove('active'));
            }

            function resetGame() {
                currentPlayer = 'X';
                nextBoard = null;
                mainBoard = Array(9).fill(null);
                createBoards();
                updateStatus();
            }

            resetButton.addEventListener('click', resetGame);
            createBoards();
            updateStatus();
        });
    </script>
</body>
</html>
